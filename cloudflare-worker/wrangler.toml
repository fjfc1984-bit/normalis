name            = "normalis"
main            = "worker.js"
compatibility_date = "2024-09-23"
account_id      = "e4ba3dc6b998c992411a8bc56bc02d2b"

# ─────────────────────────────────────────────────────────────
# SECRETS (configurar con wrangler o Cloudflare Dashboard)
# NUNCA pongas valores reales aquí — solo nombres
#
#   npx wrangler secret put GROQ_API_KEY
#   → Obtener en: https://console.groq.com/keys  (GRATIS)
#
#   npx wrangler secret put RESEND_API_KEY
#   → Obtener en: https://resend.com/api-keys    (GRATIS hasta 100 emails/día)
#
# Cron — recordatorios de vencimientos:
#   npx wrangler secret put FIREBASE_API_KEY
#   → Valor: AIzaSyArUb9rzv6lHeunq_bPgbbe0vmekysx5R4 (clave pública del proyecto)
#
#   npx wrangler secret put CRON_EMAIL
#   → Crear en Firebase Auth: cron@normalis.co (contraseña larga, sin acceso web)
#
#   npx wrangler secret put CRON_PASSWORD
#   → La contraseña del usuario cron@normalis.co creado en Firebase
#
#   npx wrangler secret put SENTRY_DSN
#   Obtener en: Sentry Dashboard -> Projects -> normalis -> Client Keys (DSN)
#   Formato: https://<key>@o<org>.ingest.sentry.io/<project_id>
#   Si no se configura, los errores quedan solo en Cloudflare Logs (no bloquea)
#
#   npx wrangler secret put FIRMA_SIGNING_SECRET
#   → Clave para sellar firmas electrónicas (HMAC-SHA256) — NUNCA debe salir
#     de este Worker. Generar con: openssl rand -hex 32
#   Si no se configura, POST /firmar responde 503 (no bloquea el resto del sitio)
#
# Cron — recordatorios de vencimientos por WhatsApp (además del email):
#   npx wrangler secret put WHATSAPP_ACCESS_TOKEN
#   npx wrangler secret put WHATSAPP_PHONE_NUMBER_ID
#   → Meta Cloud API (WhatsApp Business Platform), gratis hasta cierto
#     volumen. Requiere una app de Meta Business + un número de WhatsApp
#     Business verificado. Obtener en: https://developers.facebook.com/apps
#     (producto "WhatsApp" > API Setup — ahí están el token temporal y el
#     Phone Number ID; para producción real generar un token permanente vía
#     un usuario del sistema en Meta Business Manager).
#   → Requiere ADEMÁS crear y que Meta apruebe la plantilla de mensaje
#     "normalis_vencimiento" (WhatsApp Manager > Plantillas de mensajes,
#     idioma Spanish genérico). Categoría real: MARKETING — Meta rechazó
#     UTILITY para este texto (ver el comentario junto a
#     sendWhatsAppVencimiento() en worker.js para el detalle y las
#     implicaciones de opt-in/tarifas).
#   Si no se configura, el cron sigue enviando solo por email — no bloquea
#     nada (mismo patrón que RESEND_API_KEY/FIRMA_SIGNING_SECRET arriba).
# ─────────────────────────────────────────────────────────────

[triggers]
# Cron diario 8am Colombia (UTC-5 → 13:00 UTC)
crons = ["0 13 * * *"]

[observability]
enabled = true

[ai]
binding = "AI"
