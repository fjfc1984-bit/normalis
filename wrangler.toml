# NormaLis — Cloudflare Worker Configuration
# Deploy: wrangler deploy
# Logs:   wrangler tail

name       = "normalis"
main       = "cloudflare-worker.js"
compatibility_date = "2024-09-23"

# ─── Workers AI + Vectorize (RAG) — OPCIONAL ────────────────────────────────
# Habilitar solo si el índice normalis-rag existe en Cloudflare:
#   wrangler vectorize create normalis-rag --dimensions=768 --metric=cosine
#   python scripts/prepare_rag.py && python scripts/upload_embeddings.py
# Luego descomentar:
# [ai]
# binding = "AI"
# [[vectorize]]
# binding    = "VECTORIZE"
# index_name = "normalis-rag"

# ─── Variables de entorno (NO son secrets — se pueden publicar) ─────────────
[vars]
FIREBASE_PROJECT_ID = "normalis-5587d"

# ─── Secrets (configurar con wrangler secret put — NUNCA poner aquí) ────────
# GROQ_API_KEY          → https://console.groq.com/keys
# FIREBASE_CLIENT_EMAIL → "client_email" del serviceAccountKey.json
# FIREBASE_PRIVATE_KEY  → "private_key" del serviceAccountKey.json
#
# Cómo configurar los secrets de Firebase:
#   1. Firebase Console → Configuración → Cuentas de servicio → Generar clave privada
#   2. Abre el JSON descargado y copia "client_email" y "private_key"
#   3. En la terminal (carpeta normalis):
#      wrangler secret put FIREBASE_CLIENT_EMAIL
#      (pega el valor de "client_email" cuando te lo pida y presiona Enter)
#      wrangler secret put FIREBASE_PRIVATE_KEY
#      (pega el valor de "private_key" — incluye las líneas -----BEGIN/END-----)
#   4. wrangler deploy
#
# NOTA: Sin estos secrets el Worker funciona igual que antes (sin contexto Firestore).

# ─── Cron Triggers — recordatorios de vencimientos ──────────────────────────
[triggers]
crons = ["0 12 * * 1"]   # Lunes 12:00 UTC — recordatorios semanales
